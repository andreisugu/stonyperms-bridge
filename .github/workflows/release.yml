name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to rebuild (for example v0.1.0)'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Set up Temurin JDK 25
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3

      - name: Resolve release version
        shell: bash
        run: |
          set -euo pipefail
          tag="$TAG"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Invalid release tag '$tag'; expected vMAJOR.MINOR.PATCH"
            exit 1
          fi
          git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null
          version="${tag#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "TAG=$tag" >> "$GITHUB_ENV"

      - name: Build and test
        run: ./gradlew clean build -PreleaseVersion="$VERSION" --no-daemon --stacktrace

      - name: Collect release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          paper="paper/build/libs/stonyperms-bridge-paper-${VERSION}.jar"
          fabric="fabric/build/libs/stonyperms-bridge-fabric-${VERSION}.jar"
          test -f "$paper"
          test -f "$fabric"
          cp "$paper" "$fabric" dist/
          if compgen -G 'dist/*SNAPSHOT*' >/dev/null; then
            echo "::error::SNAPSHOT artifact in release assets"
            exit 1
          fi
          (cd dist && sha256sum *.jar | sort -k2 > SHA256SUMS)
          cat dist/SHA256SUMS

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.jar dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.jar dist/SHA256SUMS \
              --title "StonyPerms Bridge $TAG" \
              --generate-notes
          fi
